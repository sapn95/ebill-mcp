# The checks are the ones `npm run gate` runs locally, listed here one step at
# a time rather than behind that single command. Each is still defined once, in
# package.json; what is spelled out is only the order. The reason is the checks
# list on a pull request: "lint" going red says what happened, where a red
# "gate" is a log to go and read.
#
# The frame around them — triggers, permissions, concurrency, timeouts, and the
# workflow and secret jobs — is the shared one:
# https://github.com/sapn95/.github/blob/main/CI.md
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    # The suite drives a real Chromium, and the browser download is most of
    # the rest.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # The floor package.json claims to support, and the current release.
        # Both, because "engines: >=20.19" is a claim like any other.
        node: ["20", "24"]
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing here pushes, and `pull_request` runs code from strangers.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: install
        # --ignore-scripts, so a postinstall in a dependency cannot run on a
        # runner that has just checked out somebody else's branch. Playwright's
        # browser download is done explicitly below instead.
        run: npm ci --ignore-scripts

      - name: syntax
        run: node --check index.js

      - name: lint
        run: npm run lint

      # The suite attaches to a real Chromium holding a local fixture, so the
      # browser has to be here before anything runs. Left out, every test is
      # cancelled and the failure reads like a broken test rather than a
      # missing dependency.
      - name: chromium, for the suite to attach to
        run: npx playwright install --with-deps chromium

      # Protocol handshake and tool-schema validation. Offline: no network, no
      # credentials, so it is safe on a public runner.
      - name: smoke test
        run: npm run smoke

      - name: hygiene, being secrets, personal data and tracked state files
        run: npm run hygiene

      # The suites drive the server over stdio, attached to a throwaway Chromium
      # that is holding a local fixture open. They never reach a bank: the portal
      # origin is 127.0.0.1, the CDP endpoint is a browser this job launched, and
      # the e-banking URL is set to empty. Fails below 88% lines / 95% functions.
      - name: tests, with a coverage floor under them
        run: npm run coverage

      - name: audit
        # A finding here is nearly always transitive and unreachable from this
        # code, and blocking a pull request on somebody else's advisory helps
        # nobody. Dependabot files the ones that need doing.
        continue-on-error: true
        run: npm audit --audit-level=high

  workflows:
    name: lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: actionlint
        uses: raven-actions/actionlint@v2.2.0
        env:
          # shellcheck's info and style notes are advisory here; a warning or
          # worse blocks. The same setting in every repository, so the same
          # command means the same thing everywhere.
          SHELLCHECK_OPTS: --severity=warning
      - name: yamllint
        run: pipx run yamllint .
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks reads the history, not just the tip.
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
